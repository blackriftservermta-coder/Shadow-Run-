<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Shadow Run Multiplayer</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b19;color:white;font-family:Tahoma,Arial;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block}.panel{position:fixed;z-index:2;background:#071329d9;border:1px solid #00eaff77;border-radius:12px;padding:10px}#brand{top:10px;left:10px;color:#00f0ff;font-weight:bold}#stats{top:10px;right:10px;font-size:12px;line-height:2;text-align:right}#controls{position:fixed;z-index:3;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px}.cluster{display:flex;gap:8px}button{border:1px solid #00eaff88;background:#061329df;color:white;border-radius:16px;padding:15px;font-size:20px;min-width:58px;min-height:58px}#jump{border-color:#ff2b91;background:#ff2b9133;font-size:14px}#lobby{position:fixed;z-index:5;inset:0;background:#050817eF;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(420px,100%);text-align:center;background:#09142c;border:1px solid #00eaff77;border-radius:22px;padding:22px;box-shadow:0 0 40px #00eaff22}.logo{font-size:27px;color:#00f0ff;font-weight:bold}.sub{font-size:12px;line-height:2;color:#b9c9e8;margin:12px}input{width:100%;margin:5px 0;padding:13px;background:#061023;color:white;border:1px solid #34516d;border-radius:10px;text-align:center}#join,#offline{width:100%;font-size:14px;margin-top:7px;background:linear-gradient(90deg,#00eaff,#76fff2);color:#06101b;font-weight:bold}#offline{background:linear-gradient(90deg,#ff2b91,#ffa6d4)}#msg{font-size:12px;color:#ffc1df;min-height:20px;margin-top:8px}
</style></head><body><div id="game"></div><div id="brand" class="panel">SHADOW RUN<br><small>ROOFTOP CHASE • MULTIPLAYER</small></div><div id="stats" class="panel">امتیاز: <b id="score">0</b><br>بازیکنان: <b id="count">1</b><br><span id="status">آماده</span></div><div id="controls"><div class="cluster"><button id="left">◀</button><button id="right">▶</button></div><div class="cluster"><button id="slide">سر بخور ↓</button><button id="jump">پرش ↑</button></div></div><div id="lobby"><div class="card"><div class="logo">SHADOW RUN</div><div class="sub">فرار سه‌بعدی روی پشت‌بام‌ها!<br>برای آنلاین شدن، آدرس سرور لازم است.</div><input id="name" maxlength="16" value="Runner" placeholder="نام بازیکن"><input id="server" placeholder="آدرس سرور HTTPS"><button id="join">ورود به مسابقه آنلاین</button><button id="offline">تمرین آفلاین</button><div id="msg">نسخه آزمایشی؛ سرور باید جداگانه راه‌اندازی شود.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script>
(()=>{const root=document.getElementById('game');if(!window.THREE){document.getElementById('msg').textContent='برای بارگذاری سه‌بعدی اینترنت را بررسی کن.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b19);scene.fog=new THREE.Fog(0x070b19,35,140);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);camera.position.set(0,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9ceeff,0x151329,2));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-4,10,5);scene.add(light);
const material=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,metalness:.3,roughness:.5});const roof=material(0x151e38),cyan=material(0x00eaff,1.4),pink=material(0xff2b91,1.4),win=material(0x167b9a,1),dark=material(0x0b1024),gold=material(0xffc928,1.5);
function cube(x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}cube(0,-.25,-75,12,.5,180,roof);for(let z=8;z>-170;z-=8){cube(-3.5,.02,z,.04,.02,5,cyan);cube(3.5,.02,z,.04,.02,5,cyan)}
for(let s of [-1,1])for(let i=0;i<34;i++){let z=8-i*5.2,h=5+Math.random()*17,w=3+Math.random()*5,x=s*(9+Math.random()*12);cube(x,h/2-.2,z,w,h,4,i%3?dark:material(0x20112c));for(let y=1;y<h-1;y+=2.2)for(let xx=-w/2+.5;xx<w/2;xx+=1.2)if(Math.random()>.3)cube(x+xx,y,z+2.02,.35,.7,.05,Math.random()>.5?win:pink)}
const lanes=[-2.3,0,2.3];function runner(col){let g=new THREE.Group(),s=material(col,1),leg=material(0x18213b),skin=material(0xf0b99b),visor=material(0x06101d);function part(geo,m,x,y,z){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o)}part(new THREE.BoxGeometry(.55,.75,.32),s,0,1.1,0);part(new THREE.SphereGeometry(.22,12,10),skin,0,1.7,0);part(new THREE.BoxGeometry(.36,.12,.08),visor,0,1.73,-.18);for(let q of [-1,1]){part(new THREE.BoxGeometry(.16,.62,.17),s,q*.37,1.12,0);part(new THREE.BoxGeometry(.2,.6,.22),leg,q*.15,.42,0)}scene.add(g);return g}
const me=runner(0x00eaff),remotes=new Map(),cops=[runner(0xff2b91),runner(0xff2b91)];cops[0].position.set(-2.3,0,10);cops[1].position.set(2.3,0,13);
const obs=[],coins=[];for(let i=0;i<13;i++){let lane=Math.floor(Math.random()*3),o=cube(lanes[lane],.55,-12-i*12,1,1.1,.8,pink);o.userData={coin:false};obs.push(o);let c=new THREE.Mesh(new THREE.TorusGeometry(.32,.09,8,16),gold);c.position.set(lanes[Math.floor(Math.random()*3)],1.2,-18-i*12);scene.add(c);coins.push(c)}
let lane=1,vy=0,jump=false,sliding=false,slideEnd=0,started=false,online=false,socket=null,score=0,last=performance.now(),lastSend=0;
function change(d){lane=Math.max(0,Math.min(2,lane+d))}function leap(){if(started&&!jump){vy=8.5;jump=true}}function slide(){sliding=true;slideEnd=performance.now()+600}
document.getElementById('left').onpointerdown=e=>{e.preventDefault();change(-1)};document.getElementById('right').onpointerdown=e=>{e.preventDefault();change(1)};document.getElementById('jump').onpointerdown=e=>{e.preventDefault();leap()};document.getElementById('slide').onpointerdown=e=>{e.preventDefault();slide()};
onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')change(-1);if(e.key==='ArrowRight'||e.key==='d')change(1);if(e.key==='ArrowUp'||e.key===' ')leap();if(e.key==='ArrowDown')slide()};
function begin(local){started=true;document.getElementById('lobby').style.display='none';document.getElementById('status').textContent=local?'آفلاین':'در حال اتصال';if(local)return;let url=document.getElementById('server').value.trim();if(!url){document.getElementById('status').textContent='بدون سرور';alert('برای بازی چندنفره، اول باید سرور آنلاین راه‌اندازی شود. فعلاً تمرین آفلاین را بازی کن.');return}if(!window.io){alert('Socket.IO بارگذاری نشد');return}socket=io(url);socket.on('connect',()=>{online=true;document.getElementById('status').textContent='آنلاین ✓';socket.emit('join',{name:document.getElementById('name').value,lane})});socket.on('players',list=>{document.getElementById('count').textContent=list.length;let alive=new Set();for(let p of list){if(p.id===socket.id)continue;alive.add(p.id);if(!remotes.has(p.id))remotes.set(p.id,runner([0xff2b91,0x9b62ff,0xffc928,0x5effa1][p.id.length%4]));let r=remotes.get(p.id);r.userData.target={x:lanes[p.lane],y:p.y,z:2};}for(let [id,r] of remotes)if(!alive.has(id)){scene.remove(r);remotes.delete(id)}});socket.on('disconnect',()=>document.getElementById('status').textContent='قطع اتصال')}
document.getElementById('join').onclick=()=>begin(false);document.getElementById('offline').onclick=()=>begin(true);
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.04,(now-last)/1000);last=now;if(started){score+=dt*10;document.getElementById('score').textContent=Math.floor(score);me.position.x+=(lanes[lane]-me.position.x)*Math.min(1,dt*12);me.position.y+=vy*dt;vy-=22*dt;if(me.position.y<=0){me.position.y=0;vy=0;jump=false}if(now>slideEnd)sliding=false;me.scale.y=sliding?.6:1;for(let o of obs){o.position.z+=17*dt;if(o.position.z>4){o.position.z=-150-Math.random()*30;o.position.x=lanes[Math.floor(Math.random()*3)]}if(Math.abs(o.position.z-2)<.7&&Math.abs(o.position.x-me.position.x)<.7&&me.position.y<.6&&!sliding){score=Math.max(0,score-15);o.position.z=-140}}for(let c of coins){c.position.z+=17*dt;c.rotation.z+=dt*3;if(c.position.z>4){c.position.z=-160-Math.random()*30;c.position.x=lanes[Math.floor(Math.random()*3)]}if(Math.abs(c.position.z-2)<.8&&Math.abs(c.position.x-me.position.x)<.7){score+=25;c.position.z=-170}}cops.forEach((c,i)=>{c.position.z=10+i*3+Math.sin(now/350+i)*.2;c.position.x+=(lanes[Math.max(0,Math.min(2,lane+(i?1:-1)))]-c.position.x)*dt*.8});if(socket&&socket.connected&&now-lastSend>100){socket.emit('state',{lane,y:me.position.y,z:0,score:Math.floor(score)});lastSend=now}}for(let r of remotes.values())if(r.userData.target){let t=r.userData.target;r.position.x+=(t.x-r.position.x)*.15;r.position.y+=(t.y-r.position.y)*.15;r.position.z+=(t.z-r.position.z)*.15}camera.position.x+=(me.position.x*.22-camera.position.x)*dt*2;camera.position.y=5+me.position.y*.15;camera.lookAt(me.position.x*.25,1,-5);renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
})();
</script></body></html>
